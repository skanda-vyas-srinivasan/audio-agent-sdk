[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sonexis"
version = "0.3.0"
description = "Source-aware async Python SDK for the local Sonexis audio Runtime"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-2.0-or-later"}
authors = [{name = "Sonexis contributors"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Typing :: Typed",
]

[project.optional-dependencies]
openai = ["openai[realtime]>=2; python_version >= '3.10'"]
gemini = ["google-genai>=1; python_version >= '3.10'"]
mcp = ["mcp>=2,<3; python_version >= '3.10'"]
ai = [
  "openai[realtime]>=2; python_version >= '3.10'",
  "google-genai>=1; python_version >= '3.10'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sonexis = ["py.typed"]
